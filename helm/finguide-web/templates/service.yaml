apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: finguide-web
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: finguide-web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
