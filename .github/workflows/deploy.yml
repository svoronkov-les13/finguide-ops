name: Deploy FinGuide Overlay

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - les13
      api_image_tag:
        description: API image tag
        required: true
        default: latest
      web_image_tag:
        description: Web image tag
        required: true
        default: latest

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Select deployment target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            les13)
              echo "NAMESPACE=finguide" >> "$GITHUB_ENV"
              echo "API_DEPLOYMENT=finguide-api" >> "$GITHUB_ENV"
              echo "WEB_DEPLOYMENT=finguide-web" >> "$GITHUB_ENV"
              echo "KEYCLOAK_DEPLOYMENT=keycloak" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "NAMESPACE=finguide-dev" >> "$GITHUB_ENV"
              echo "API_DEPLOYMENT=finguide-api-dev" >> "$GITHUB_ENV"
              echo "WEB_DEPLOYMENT=finguide-web-dev" >> "$GITHUB_ENV"
              echo "KEYCLOAK_DEPLOYMENT=keycloak-dev" >> "$GITHUB_ENV"
              ;;
          esac
          echo "OVERLAY=k8s/overlays/${ENVIRONMENT}" >> "$GITHUB_ENV"

      - name: Apply runtime secrets
        env:
          FINGUIDE_API_DB_PASSWORD: ${{ secrets.FINGUIDE_API_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: bash scripts/apply-runtime-secrets.sh

      - name: Deploy overlay
        env:
          API_IMAGE_TAG: ${{ inputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ inputs.web_image_tag }}
        run: bash scripts/deploy-kustomize-overlay.sh
