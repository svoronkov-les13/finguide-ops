name: Deploy FinGuide Overlay

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - les13
      api_image_tag:
        description: API image tag
        required: true
        default: latest
      web_image_tag:
        description: Web image tag
        required: true
        default: latest

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy overlay
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          API_IMAGE_TAG: ${{ inputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ inputs.web_image_tag }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            les13)
              export NAMESPACE="finguide"
              export API_DEPLOYMENT="finguide-api"
              export WEB_DEPLOYMENT="finguide-web"
              export KEYCLOAK_DEPLOYMENT="keycloak"
              ;;
            dev)
              export NAMESPACE="finguide-dev"
              export API_DEPLOYMENT="finguide-api-dev"
              export WEB_DEPLOYMENT="finguide-web-dev"
              export KEYCLOAK_DEPLOYMENT="keycloak-dev"
              ;;
          esac

          export OVERLAY="k8s/overlays/${ENVIRONMENT}"
          bash scripts/deploy-kustomize-overlay.sh
