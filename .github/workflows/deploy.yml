name: Deploy FinGuide

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - demo
          - les13
          - prod
      api_image_tag:
        description: API image tag
        required: true
        default: latest
      web_image_tag:
        description: Web image tag
        required: true
        default: latest

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy overlay
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          API_IMAGE_TAG: ${{ inputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ inputs.web_image_tag }}
        run: |
          set -euo pipefail
          overlay="k8s/overlays/${ENVIRONMENT}"

          kubectl kustomize "$overlay" \
            | sed "s#ghcr.io/svoronkov-les13/finguide-api:[^[:space:]]*#ghcr.io/svoronkov-les13/finguide-api:${API_IMAGE_TAG}#g" \
            | sed "s#ghcr.io/svoronkov-les13/finguide-web:[^[:space:]]*#ghcr.io/svoronkov-les13/finguide-web:${WEB_IMAGE_TAG}#g" \
            | kubectl apply -f -

      - name: Wait for rollout
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" == "les13" ]]; then
            namespace="finguide"
            api_deployment="finguide-api"
            web_deployment="finguide-web"
          else
            namespace="finguide-${ENVIRONMENT}"
            api_deployment="finguide-api-${ENVIRONMENT}"
            web_deployment="finguide-web-${ENVIRONMENT}"
          fi

          kubectl -n "$namespace" rollout status deployment/"$api_deployment" --timeout=180s
          kubectl -n "$namespace" rollout status deployment/"$web_deployment" --timeout=180s
