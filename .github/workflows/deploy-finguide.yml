name: Deploy finguide

on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: API image tag
        required: true
        default: les13
      web_image_tag:
        description: Web image tag
        required: true
        default: les13

jobs:
  deploy:
    name: Deploy finguide
    runs-on: ubuntu-latest
    environment: les13
    concurrency:
      group: deploy-finguide
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply runtime secrets
        env:
          NAMESPACE: finguide
          FINGUIDE_API_DB_PASSWORD: ${{ secrets.FINGUIDE_API_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: bash scripts/apply-runtime-secrets.sh

      - name: Deploy finguide
        env:
          OVERLAY: k8s/overlays/les13
          NAMESPACE: finguide
          API_IMAGE_TAG: ${{ inputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ inputs.web_image_tag }}
          API_DEPLOYMENT: finguide-api
          WEB_DEPLOYMENT: finguide-web
          KEYCLOAK_DEPLOYMENT: keycloak
        run: bash scripts/deploy-kustomize-overlay.sh
