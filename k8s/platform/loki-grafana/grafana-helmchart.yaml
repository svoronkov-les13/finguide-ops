apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: kube-system
spec:
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  version: 10.5.15
  targetNamespace: loki-grafana
  createNamespace: false
  valuesContent: |-
    ingress:
      enabled: false

    service:
      type: ClusterIP

    persistence:
      enabled: true
      size: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: false
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-server:80
            isDefault: true
