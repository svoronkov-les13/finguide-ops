apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finguide-dev
nameSuffix: -dev
resources:
  - ../../base
  - ../../base/keycloak
  - configmap.yaml
  - ingress.yaml
  - keycloak-realm.yaml
  - quota.yaml
images:
  - name: ghcr.io/svoronkov-les13/finguide-api
    newTag: dev
  - name: ghcr.io/svoronkov-les13/finguide-web
    newTag: dev
  - name: ghcr.io/svoronkov-les13/finguide-keycloak
    newTag: dev
patches:
  - path: patches/finguide-api-resources.yaml
  - path: patches/finguide-web-resources.yaml
  - path: patches/keycloak-dev.yaml
  - path: patches/keycloak-postgres-dev.yaml
  - path: patches/keycloak-postgres-pvc.yaml
