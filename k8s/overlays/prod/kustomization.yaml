apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finguide-prod
resources:
  - ../../base
nameSuffix: -prod
images:
  - name: ghcr.io/svoronkov-les13/finguide-api
    newTag: prod
  - name: ghcr.io/svoronkov-les13/finguide-web
    newTag: prod
patches:
  - target:
      kind: Namespace
      name: finguide
    patch: |-
      - op: replace
        path: /metadata/name
        value: finguide-prod
  - target:
      kind: Deployment
      name: finguide-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: finguide-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
