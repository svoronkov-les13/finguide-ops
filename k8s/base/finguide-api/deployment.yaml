apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguide-api
  labels:
    app.kubernetes.io/name: finguide-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finguide-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finguide-api
    spec:
      containers:
        - name: api
          image: ghcr.io/svoronkov-les13/finguide-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finguide-api-config
                optional: true
            - secretRef:
                name: finguide-api-secrets
                optional: true
          env:
            - name: FINGUIDE_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguide-api-secrets
                  key: fg-api-db-password
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          startupProbe:
            httpGet:
              path: /finguide-api/actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /finguide-api/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /finguide-api/actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: finguide-api-data
              mountPath: /data
      volumes:
        - name: finguide-api-data
          persistentVolumeClaim:
            claimName: finguide-api-data
