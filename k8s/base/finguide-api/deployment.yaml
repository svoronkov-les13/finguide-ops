apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguide-api
  labels:
    app.kubernetes.io/name: finguide-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finguide-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finguide-api
    spec:
      containers:
        - name: api
          image: ghcr.io/svoronkov-les13/finguide-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: finguide-api-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
