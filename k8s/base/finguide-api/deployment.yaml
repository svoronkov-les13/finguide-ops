apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguide-api
  labels:
    app.kubernetes.io/name: finguide-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finguide-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finguide-api
    spec:
      containers:
        - name: api
          image: ghcr.io/svoronkov-les13/finguide-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: finguide-api-config
                optional: true
            - secretRef:
                name: finguide-api-secrets
                optional: true
          env:
            - name: FINGUIDE_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguide-api-secrets
                  key: fg-api-db-password
            - name: FINGUIDE_KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-username
            - name: FINGUIDE_KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-password
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1536Mi
          volumeMounts:
            - name: finguide-api-data
              mountPath: /data
      volumes:
        - name: finguide-api-data
          persistentVolumeClaim:
            claimName: finguide-api-data
