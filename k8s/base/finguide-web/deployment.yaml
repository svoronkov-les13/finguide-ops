apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguide-web
  labels:
    app.kubernetes.io/name: finguide-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finguide-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finguide-web
    spec:
      containers:
        - name: web
          image: ghcr.io/svoronkov-les13/finguide-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: finguide-web-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
